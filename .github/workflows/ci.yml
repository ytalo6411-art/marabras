name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar (typecheck, lint, testes, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O postinstall valida as variáveis de ambiente; no CI usamos
      # --warn-only porque o build não depende do Supabase estar acessível.
      - name: Verificar variáveis de ambiente
        run: node scripts/verify-env.mjs --warn-only

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck das Vercel Functions (api/)
        run: npm run typecheck:api

      # Valida offline o divisor de comandos usado para aplicar as migrações
      # quando o servidor exige um comando por requisição.
      - name: Autoteste do aplicador de migrações
        run: node scripts/apply-migrations.mjs --self-test

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Migrações e isolamento no PostgreSQL local
        run: npm run test:db

      - name: Testes de segurança (API/IA + PostgreSQL two-user)
        run: npm run test:security && node scripts/test-security-database.mjs

      - name: Cobertura de traduções
        run: npm run test:i18n

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Fluxos reais no navegador (fixtures isoladas)
        run: npm run test:browser
        env:
          CI: 'true'
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-public-key

      - name: Build
        run: npm run build:only

      - name: Verificar artefatos do PWA
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/offline.html
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          echo "Artefatos do PWA presentes."
