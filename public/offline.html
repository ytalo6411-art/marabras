<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ATHLETIX — Você está offline</title>
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070a;
        --card: #0d1117;
        --text: #f2f4f7;
        --dim: #8b95a5;
        --accent: #ff4d2e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .wrap { max-width: 380px; display: grid; gap: 14px; justify-items: center; }
      .mark {
        font-size: 56px; line-height: 1;
        width: 76px; height: 76px; border-radius: 20px;
        background: var(--card); border: 1px solid #1c2430;
        display: grid; place-items: center;
      }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
      a {
        margin-top: 6px; padding: 11px 20px; border-radius: 10px;
        background: var(--accent); color: #fff; text-decoration: none;
        font-weight: 700; font-size: 14px;
      }
      small { color: #5b6675; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">📡</div>
      <h1>Você está offline</h1>
      <p>
        Sem conexão com a internet. As páginas que você já visitou continuam
        disponíveis neste dispositivo.
      </p>
      <a href="/">Tentar novamente</a>
      <small>ATHLETIX V2 — PWA</small>
    </div>
  </body>
</html>
