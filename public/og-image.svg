<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ATHLETIX — Treino, Nutrição e Evolução">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.55" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d2e"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#ff4d2e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#c6f432" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c6f432" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- barra de acento superior -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- marca -->
  <g transform="translate(80 96)">
    <rect width="76" height="76" rx="20" fill="#0e131b" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M20 55V21h9.5l13.5 17.8V21H51v34h-9.5L28 37.2V55h-8Z" fill="#ff4d2e"/>
    <circle cx="58" cy="27" r="7" fill="#c6f432"/>
  </g>
  <text x="176" y="134" fill="#ffffff" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="38" font-weight="900" letter-spacing="6">ATHLETIX</text>
  <text x="177" y="166" fill="#8b95a5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="500" letter-spacing="1.4">TREINO · NUTRIÇÃO · EVOLUÇÃO</text>

  <!-- título -->
  <text x="80" y="300" fill="#ffffff" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="82" font-weight="900" letter-spacing="-1.5">SUA EVOLUÇÃO</text>
  <text x="80" y="388" fill="#ffffff" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="82" font-weight="900" letter-spacing="-1.5">COMEÇA AQUI.</text>
  <rect x="82" y="412" width="128" height="7" rx="3.5" fill="#c6f432"/>

  <!-- subtítulo -->
  <text x="80" y="470" fill="#a8b2c0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="26" font-weight="500">Bilhões de exercícios com vídeo, treinos guiados,</text>
  <text x="80" y="508" fill="#a8b2c0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="26" font-weight="500">diário alimentar e progresso — no seu ritmo.</text>

  <!-- pílulas de recursos -->
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="600">
    <g transform="translate(80 556)">
      <rect width="232" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="26" cy="23" r="6" fill="#ff4d2e"/>
      <text x="44" y="30" fill="#e6ebf2">317 exercícios com vídeo</text>
    </g>
    <g transform="translate(328 556)">
      <rect width="184" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="26" cy="23" r="6" fill="#c6f432"/>
      <text x="44" y="30" fill="#e6ebf2">Login com Google</text>
    </g>
    <g transform="translate(528 556)">
      <rect width="200" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="26" cy="23" r="6" fill="#39a0ff"/>
      <text x="44" y="30" fill="#e6ebf2">App mobile (PWA)</text>
    </g>
  </g>

  <!-- barra de rodapé -->
  <rect x="0" y="624" width="1200" height="6" fill="#ffffff" fill-opacity="0.06"/>
  <text x="1120" y="600" fill="#5d6875" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" text-anchor="end" letter-spacing="1">ATHLETIX.APP</text>
</svg>
